<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f3f4f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
    }
    h1 {
      color: #333;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 10px;
    }
    .cell {
      width: 100px;
      height: 100px;
      background-color: #fff;
      border: 2px solid #333;
      font-size: 36px;
      text-align: center;
      line-height: 100px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .cell.disabled {
      pointer-events: none;
      background-color: #e0e0e0;
    }
    .message {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <div class="board" id="board"></div>
  <p class="message" id="message">Giliran Pemain X</p>
  <button onclick="restartGame()">Mulai Ulang</button>

  <script>
    let currentPlayer = "X";
    let gameBoard = ["", "", "", "", "", "", "", "", ""];
    let gameActive = true;

    const boardElement = document.getElementById("board");
    const messageElement = document.getElementById("message");

    function createBoard() {
      boardElement.innerHTML = "";
      for (let i = 0; i < 9; i++) {
        const cell = document.createElement("div");
        cell.classList.add("cell");
        cell.addEventListener("click", () => handleCellClick(i));
        boardElement.appendChild(cell);
      }
    }

    function handleCellClick(index) {
      if (gameBoard[index] === "" && gameActive) {
        gameBoard[index] = currentPlayer;
        updateBoard();
        if (checkWinner()) {
          messageElement.textContent = `Pemain ${currentPlayer} Menang!`;
          gameActive = false;
        } else if (gameBoard.every(cell => cell !== "")) {
          messageElement.textContent = "Seri!";
          gameActive = false;
        } else {
          currentPlayer = currentPlayer === "X" ? "O" : "X";
          messageElement.textContent = `Giliran Pemain ${currentPlayer}`;
        }
      }
    }

    function updateBoard() {
      const cells = document.querySelectorAll(".cell");
      gameBoard.forEach((value, index) => {
        cells[index].textContent = value;
        if (value !== "") cells[index].classList.add("disabled");
      });
    }

    function checkWinner() {
      const winPatterns = [
        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],
        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],
        [0, 4, 8],
        [2, 4, 6],
      ];

      return winPatterns.some(pattern => {
        const [a, b, c] = pattern;
        return gameBoard[a] === gameBoard[b] && gameBoard[b] === gameBoard[c] && gameBoard[a] !== "";
      });
    }

    function restartGame() {
      currentPlayer = "X";
      gameBoard = ["", "", "", "", "", "", "", "", ""];
      gameActive = true;
      createBoard();
      messageElement.textContent = `Giliran Pemain X`;
    }

    createBoard();
  </script>
</body>
</html>
